{% extends "base.html" %}

{% block content %}

<style>

.welcome {
    position: fixed;
    inset: 0;
    margin: 0 !important;
    min-height: 100svh !important;
    background-image: url("../images/nipahbox-bg.webp");
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
}

@media screen and (max-width: 768px) {
    .welcome {
        background-image: url("../images/nipahbox-mobilebg.webp");
        background-position: center;
        background-repeat: no-repeat;
        background-size: auto 100%;
    }
    .logo {
        width: 240px !important;
        margin-bottom: -15px !important;
    }
    h1 {
        transform: scale(0.65) !important;
        margin-bottom: 0px !important;
    }
    .welcome-button {
        position: relative;
        display: flex !important;
        flex-direction: column;
        align-items: center !important;
        top: 25px !important;
        font-size: 0.75rem !important;
    }
    .welcome-button.secondary {
        position: relative;
        top: 50px !important;
        margin-left: auto !important;
        margin-right: auto !important;

    }
}

    .md-header__option {
      display: none !important;
    }

    .md-header {
			background: linear-gradient(
			180deg,
			rgba(0, 0, 0, 0.85) 0%,
			rgba(0, 0, 0, 0.50) 45%,
			rgba(0, 0, 0, 0) 75%
			);
		}

	.md-tabs {
	}
	.md-footer {
	display: none !important;
	}
	.md-header__title {
	color: whitesmoke !important;
	}
	.md-header a {
	color: black !important;
	font-weight: 500;
	}
    .welcome {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .welcome-content {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .logo {
        width: 480px;
        height: auto;
        margin-bottom: -40px;
    }

    h1 {
        font-size: 1.4rem !important;
        font-style: italic;
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-weight: 400 !important;
        margin-top: -20px !important;
    }
    a {
        text-decoration: none !important;
    }
    .welcome-button {
        display: inline-block;
        padding: 12px 24px;
        color: black !important;
        text-decoration: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 1000;
        transition: 0.2s ease !important;
        column-gap: 20px !important;
    }
    .welcome-button:hover {
        color: rebeccapurple !important;
        transform: translateY(-5px) !important;
        opacity: 0.85;
        background: rgba(255, 255, 255, 0.2);
        border-color: mediumpurple;
        backdrop-filter: blur(5px) !important;
        -webkit-backdrop-filter: blur(5px) !important;
        transition: 0.3s ease !important;
        box-shadow: 0 5px 16px rgba(100, 0, 255, 0.45);
    }

    .welcome-button.secondary:hover {
        color: black !important;
        transform: translateY(-5px) !important;
        opacity: 0.85;
        background: rgba(255, 255, 255, 0.2);
        transition: 0.3s ease !important;
    }
    .welcome-button,
    .welcome-button.secondary {
        backdrop-filter: blur(12px) !important;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid black;
        backdrop-filter: blur(5px) !important;
        -webkit-backdrop-filter: blur(5px) !important;
        font-style: italic;
        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.40);
    }
    .welcome-button + .welcome-button.secondary {
        margin-left: 25px;
    }
</style>

<section class="welcome">
    <div class="welcome-content">

        <img src="{{ '../images/nipahbox-2.webp' | url }}" alt="Nipahbox logo" class="logo no-img-style">

        <h1>Sevgili kutumuz.</h1>
    <div>
        <a href="{{ 'fatamorgana/' | url }}" class="welcome-button">
            Fata Morgana
        </a>
        <a href="{{ 'fatamorgana/' | url }}" class="welcome-button secondary">
            Hakkımızda
        </a>
    </div>
  </div>
</section>

{% endblock %}
